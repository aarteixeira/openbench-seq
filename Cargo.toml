[package]
name = "openbench-seq"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Sequence engine for OpenBench: search, restriction sites, ORFs, translation and file parsers, compiled to WebAssembly"
repository = "https://github.com/aarteixeira/openbench-seq"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
